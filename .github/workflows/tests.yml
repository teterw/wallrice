name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install Pillow ruff
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck install.sh uninstall.sh tools/shell-test.sh tools/desktop-test.sh tools/desktops/run.sh
      - name: GNOME Shell extension parses
        run: for f in gnome-extension/*/*.js; do node --input-type=module --check < "$f" || exit 1; done
      - name: Installer dry run
        run: |
          python3 -m pip install --user Pillow
          XDG_CURRENT_DESKTOP=GNOME ./install.sh --dry-run --no-packages
          ./uninstall.sh --dry-run

  ui:
    # the picker and review need PyGObject + GTK 3, which come from the distro, not pip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 3 for Python
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 python3-cairo python3-pil
      - name: Unit tests with the UI
        run: /usr/bin/python3 -m unittest discover -s tests -v
