[project]
name = "wallrice"
description = "The whole Linux desktop takes its colours from the wallpaper"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["Pillow"]

[tool.ruff]
line-length = 130
target-version = "py39"

[tool.ruff.lint]
select = ["F", "E9", "B"]
ignore = ["B905"]  # zip(strict=) needs Python 3.10
