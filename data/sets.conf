# Which wallpapers each mode uses (`wallrice mode all|calm`). Entries are collection names from
# collections.conf, or collection/folder. Pictures removed in the review never show.

[all]
# Every collection, and folders of your own in ~/Pictures/walls
exclude =

[calm]
# Real photos and space: for presentations, or when someone else uses the PC
include = space elementary pop-os rose-pine/photography
